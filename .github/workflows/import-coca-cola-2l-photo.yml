name: Import Coca-Cola 2L product image (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-coca-cola-2l-photo.yml"

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image conversion support
        run: python -m pip install --quiet Pillow
      - name: Download actual Coca-Cola Original 2L photo and update catalog
        run: |
          python - <<'PY'
          import io
          import json
          import urllib.request
          from pathlib import Path
          from PIL import Image

          product_id = "walmart-161"
          destination = Path("assets/products/walmart/walmart-161-coca-cola-original-2l.webp")
          sources = [
              "https://target.scene7.com/is/image/Target/GUEST_3f91a579-6c2c-4edd-8191-95ff0082aa36?fmt=pjpeg&hei=650&wid=650",
              "https://bfasset.costco-static.com/U447IH35/as/sch3k37g4v5bh9kc8wwjwt9j/97905__1psd?auto=webp&format=jpg",
              "https://target.scene7.com/is/image/Target/GUEST_3f91a579-6c2c-4edd-8191-95ff0082aa36?fmt=webp&hei=650&wid=650",
          ]
          selected = None
          for url in sources:
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (compatible; product-catalog-image-import/1.0)",
                      "Accept": "image/jpeg,image/webp,image/png,*/*;q=0.5",
                  })
                  with urllib.request.urlopen(request, timeout=25) as response:
                      data = response.read(3_000_000)
                  img = Image.open(io.BytesIO(data))
                  img.load()
                  if img.width < 200 or img.height < 200:
                      raise ValueError("Image is too small")
                  img = img.convert("RGBA")
                  img.thumbnail((480, 480), Image.Resampling.LANCZOS)
                  white = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
                  white.alpha_composite(img, ((512 - img.width) // 2, (512 - img.height) // 2))
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  white.convert("RGB").save(destination, "WEBP", quality=87, method=5)
                  selected = url
                  print(f"Downloaded verified product image: {len(data)} bytes, {img.size}")
                  break
              except Exception as exc:
                  print(f"Source failed: {url.split('?')[0]}: {type(exc).__name__}: {exc}")
          if not selected:
              raise SystemExit("No image sources succeeded; catalog remains unchanged.")

          catalog_path = Path("data/products.json")
          source_text = catalog_path.read_text(encoding="utf-8")
          catalog = json.loads(source_text)
          item = next((p for p in catalog["products"] if p.get("id") == product_id), None)
          if item is None:
              raise SystemExit("Product walmart-161 not found.")
          original = item["image"]
          if not original.startswith("https://"):
              raise SystemExit("Product already has a local image; refusing to overwrite.")
          quoted_original = json.dumps(original, ensure_ascii=False)
          quoted_new = json.dumps(destination.as_posix(), ensure_ascii=False)
          if source_text.count(quoted_original) != 1:
              raise SystemExit("Old image URL is not unique in catalog; refusing change.")
          new_text = source_text.replace(quoted_original, quoted_new, 1)
          new_catalog = json.loads(new_text)
          check = next(p for p in new_catalog["products"] if p.get("id") == product_id)
          assert check["image"] == destination.as_posix()
          catalog_path.write_text(new_text, encoding="utf-8")
          print("Saved local photo and updated walmart-161.")
          PY

      - name: Validate and commit the image
        run: |
          python tools/validate_catalog.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json assets/products/walmart/walmart-161-coca-cola-original-2l.webp
          git diff --cached --check
          git commit -m "Store Coca-Cola 2L product photo locally"
          git push origin HEAD:main
